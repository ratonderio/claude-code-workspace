# Developer convenience for authoring migrations:
#   FAMILY_HQ_CONFIG=path/to/config.toml alembic revision --autogenerate -m "describe change"
# The app itself applies migrations programmatically (family_hq.db.migrate); this file is not
# used at runtime. After autogenerating, review the file and replace any reference to
# family_hq.db.types.UTCDateTime with sa.DateTime(timezone=True) so migrations stay frozen.
[alembic]
script_location = src/family_hq/db/migrations
